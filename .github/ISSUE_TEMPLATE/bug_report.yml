name: Bug report
description: Something crashes or behaves wrongly
labels: [bug]
body:
  - type: input
    id: jira
    attributes:
      label: Jira key
      placeholder: ST-XXX
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Exact command, target, input or seed, and config
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or version
    