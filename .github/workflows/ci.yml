name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM
        run: ./scripts/github/linux/install-llvm.sh

      - name: Check format
        run: ./scripts/github/linux/format.sh

  # ---------------------------- Windows chain ----------------------------

  build-windows:
    name: Build (Windows)
    needs: format
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          install-deps: 'true'
          cache: 'true'

      - name: Build project
        run: ./scripts/github/windows/build.ps1

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build/
          if-no-files-found: error

  tidy-windows:
    name: Tidy (Windows)
    needs: build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: build/

      - name: Install Qt6 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          install-deps: 'true'
          cache: 'true'

      - name: Install LLVM
        run: ./scripts/github/windows/install-llvm.ps1

      - name: Run clang-tidy
        run: ./scripts/github/windows/tidy.ps1

  tests-windows:
    name: ${{ matrix.test }} (Windows)
    needs: build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        test: [smoke, unit, interface, integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: build/

      - name: Install Qt6 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          install-deps: 'true'
          cache: 'true'

      - name: Run ${{ matrix.test }} tests
        run: ./scripts/github/windows/${{ matrix.test }}-tests.ps1

  # ----------------------------- Linux chain -----------------------------

  build-linux:
    name: Build (Linux)
    needs: format
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          install-deps: 'true'
          cache: 'true'

      - name: Build project
        run: ./scripts/github/linux/build.sh

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/
          if-no-files-found: error

  tidy-linux:
    name: Tidy (Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          install-deps: 'true'
          cache: 'true'

      - name: Install LLVM
        run: ./scripts/github/linux/install-llvm.sh

      - name: Run clang-tidy
        run: ./scripts/github/linux/tidy.sh

  tests-linux:
    name: ${{ matrix.test }} (Linux)
    needs: build-linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        test: [smoke, unit, interface, integration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/

      - name: Restore executable bits
        run: find build/tests -type f -exec chmod +x {} +

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          install-deps: 'true'
          cache: 'true'

      - name: Run ${{ matrix.test }} tests
        run: ./scripts/github/linux/${{ matrix.test }}-tests.sh
